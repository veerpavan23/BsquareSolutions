    const tasks = [
      { name: 'bsquare-logo', widths: [5000, 3000] },
      { name: 'bsquare-logo-white', widths: [5000] },
      { name: 'bsquare-logo-black', widths: [5000] },
      { name: 'bsquare-logo-blue', widths: [5000] },
      { name: 'bsquare-logo-square', widths: [2000] },
      { name: 'bsquare-logo-horizontal', widths: [5000] }
    ];

    async function downloadSvgAsPng(name, width) {
      return new Promise((resolve, reject) => {
        try {
          const b64 = svgsB64[name];
          const url = 'data:image/svg+xml;base64,' + b64;
          
          const img = new Image();
          img.crossOrigin = 'Anonymous';
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const isSquare = name.includes('square');
            const originalWidth = isSquare ? 160 : 540;
            const originalHeight = isSquare ? 160 : 140;
            
            const scale = width / originalWidth;
            canvas.width = width;
            canvas.height = originalHeight * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            try {
              const pngUrl = canvas.toDataURL('image/png');
              const a = document.createElement('a');
              a.download = (width === 5000 || width === 2000) ? name + '.png' : name + '-' + width + 'px.png';
              a.href = pngUrl;
              a.click();
            } catch(e) {
              console.error('Canvas export error:', e);
              alert('Security error exporting PNG. Your browser blocked the canvas download.');
            }
            
            resolve();
          };
          img.onerror = reject;
          img.src = url;
        } catch(e) {
          console.error(e);
          reject(e);
        }
      });
    }

    const wait = ms => new Promise(r => setTimeout(r, ms));

    document.getElementById('exportBtn').addEventListener('click', async () => {
      document.getElementById('status').innerText = 'Generating PNGs... Please allow multiple downloads.';
      for (const task of tasks) {
        for (const w of task.widths) {
          await downloadSvgAsPng(task.name, w);
          await wait(500); 
        }
      }
      document.getElementById('status').innerText = 'All PNGs generated and downloaded successfully!';
    });
  </script>
