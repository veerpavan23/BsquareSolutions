    const tasks = [
      { name: 'bsquare-logo', widths: [5000, 3000] },
      { name: 'bsquare-logo-white', widths: [5000] },
      { name: 'bsquare-logo-black', widths: [5000] },
      { name: 'bsquare-logo-blue', widths: [5000] },
      { name: 'bsquare-logo-square', widths: [2000] },
      { name: 'bsquare-logo-horizontal', widths: [5000] }
    ];

    async function downloadSvgAsPng(name, width) {
      return new Promise((resolve) => {
        const svgString = svgs[name];
        const blob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = width / img.width;
          canvas.width = width;
          canvas.height = img.height * scale;
          
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          const pngUrl = canvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.download = (width === 5000 || width === 2000) ? name + '.png' : name + '-' + width + 'px.png';
          a.href = pngUrl;
          a.click();
          
          URL.revokeObjectURL(url);
          resolve();
        };
        img.src = url;
      });
    }

    const wait = ms => new Promise(r => setTimeout(r, ms));

    document.getElementById('exportBtn').addEventListener('click', async () => {
      document.getElementById('status').innerText = 'Generating PNGs... Please click "Allow Multiple Downloads" if your browser prompts you.';
      for (const task of tasks) {
        for (const w of task.widths) {
          await downloadSvgAsPng(task.name, w);
          await wait(500); // Slight delay to ensure browser processes download
        }
      }
      document.getElementById('status').innerText = 'All PNGs generated and downloaded successfully!';
    });
  </script>
