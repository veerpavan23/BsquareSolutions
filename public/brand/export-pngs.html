<!DOCTYPE html>
<html>
<head>
  <title>BSquare Assets Exporter</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 50px; background: #f8fafc; }
    button { padding: 16px 32px; background: #0086F8; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(0,134,248,0.3); }
    button:hover { background: #006dd1; }
    #status { margin-top: 20px; font-weight: 500; color: #334155; }
    .preview { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 40px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card img { max-width: 250px; height: auto; }
    .dark-card { background: #0f172a; }
  </style>
</head>
<body>
  <h1>BSquare Asset Generator</h1>
  <p>Click the button below to instantly render and download the high-resolution PNG assets (5000px wide).</p>
  <button id="exportBtn">Download All PNGs</button>
  <div id="status"></div>
  
  <div class="preview">
    <div class="card"><img src="bsquare-logo.svg" /><p>Full Color</p></div>
    <div class="card dark-card"><img src="bsquare-logo-white.svg" /><p style="color:white">White</p></div>
    <div class="card"><img src="bsquare-logo-blue.svg" /><p>Blue</p></div>
    <div class="card"><img src="bsquare-logo-black.svg" /><p>Black</p></div>
    <div class="card"><img src="bsquare-logo-square.svg" /><p>Square Icon</p></div>
  </div>

  <script>
    const tasks = [
      { name: 'bsquare-logo', widths: [5000, 3000] },
      { name: 'bsquare-logo-white', widths: [5000] },
      { name: 'bsquare-logo-black', widths: [5000] },
      { name: 'bsquare-logo-blue', widths: [5000] },
      { name: 'bsquare-logo-square', widths: [2000] },
      { name: 'bsquare-logo-horizontal', widths: [5000] }
    ];

    async function downloadSvgAsPng(name, width) {
      return new Promise(async (resolve, reject) => {
        try {
          const response = await fetch(name + '.svg');
          const svgString = await response.text();
          
          const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
          
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const isSquare = name.includes('square');
            const originalWidth = isSquare ? 160 : 540;
            const originalHeight = isSquare ? 160 : 140;
            
            const scale = width / originalWidth;
            canvas.width = width;
            canvas.height = originalHeight * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            try {
              const pngUrl = canvas.toDataURL('image/png');
              const a = document.createElement('a');
              a.download = (width === 5000 || width === 2000) ? name + '.png' : name + '-' + width + 'px.png';
              a.href = pngUrl;
              a.click();
            } catch(e) {
              console.error('Canvas export error:', e);
              alert('Security error: Could not export PNG. Try opening this file via a local server or Vercel domain.');
            }
            
            resolve();
          };
          img.onerror = reject;
          img.src = url;
        } catch(e) {
          console.error(e);
          reject(e);
        }
      });
    }

    const wait = ms => new Promise(r => setTimeout(r, ms));

    document.getElementById('exportBtn').addEventListener('click', async () => {
      document.getElementById('status').innerText = 'Generating PNGs... Please click "Allow Multiple Downloads" if your browser prompts you.';
      for (const task of tasks) {
        for (const w of task.widths) {
          await downloadSvgAsPng(task.name, w);
          await wait(500); 
        }
      }
      document.getElementById('status').innerText = 'All PNGs generated and downloaded successfully!';
    });
  </script>
</body>
</html>
